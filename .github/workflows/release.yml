name: Release

# Manual only. Bump versions locally with `bun run release:version <version>`
# (commits and tags), push with `git push --follow-tags`, then run this.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing to npm"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all publishable packages
        run: bun run build

      # Upstream typst.ts plus patches/, compiled to WebAssembly (~6 min).
      # rustup on the runner installs the toolchain the checkout pins.
      - name: Build @leandown/typst.ts
        run: bun run build:typst

      - name: Lint packed packages
        run: bun run lint:packages

      # Skips versions already on npm, so a failed run can be re-run.
      # Nx tries `bun publish` first; bun can't do npm OIDC trusted
      # publishing, so Nx falls back to `npm publish` on the auth error.
      - name: Publish to npm
        run: bunx nx release publish ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # DO NOT add NODE_AUTH_TOKEN / NPM_TOKEN here.
          # npm auth is handled via OIDC (id-token: write above) — no secret token needed.
          NX_NO_CLOUD: "true"
