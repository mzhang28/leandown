name: Release

# Manual only. Versions are set by hand in each package.json — bump them,
# commit, then run this workflow (or run `bun run release` locally).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing to npm"
        type: boolean
        default: true

permissions:
  contents: write # push the per-package release tags
  id-token: write # required for npm OIDC provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to push tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all publishable packages
        run: bun run build

      - name: Verify packed exports resolve to .js (not .ts)
        run: node scripts/verify-publish.mjs

      - name: Publish to npm
        run: node scripts/publish-packages.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # DO NOT add NODE_AUTH_TOKEN / NPM_TOKEN here.
          # npm auth is handled via OIDC (id-token: write above) — no secret token needed.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Push release tags
        if: ${{ !inputs.dry_run }}
        run: git push --tags
